name: Record outcome
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write
  issues: read
  pull-requests: read
jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'pyyaml==6.0.*'
      - run: python .github/scripts/common.py learn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
